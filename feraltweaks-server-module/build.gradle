plugins {
	id 'java'
	id 'maven-publish'
}


// Basic information
version = "1.0.0-b4"
group = "org.asf.centuria"

ext.modulePackage = "org.asf.centuria.feraltweaks"
ext.moduleClass = "FeralTweaksModule"
ext.authorname = "AerialWorks Software Foundation"

// Internal
apply plugin: 'eclipse'

Calendar cal = new GregorianCalendar();
cal.setTime(new Date());
ext.buildyear = cal.get(Calendar.YEAR).toString();

repositories {
	mavenCentral()
	maven { name = "AerialWorks"; url = "https://aerialworks.ddns.net/maven" }
	flatDir {
		dirs 'libraries'
	}
}

jar {
	manifest {
		attributes([
			"Specification-Title": project.name,
			"Specification-Vendor": "${authorname}",
			"Specification-Version": project.version,
			"Implementation-Title": project.name,
			"Implementation-Version": project.version,
			"Implementation-Vendor" :"${authorname}",
			"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
	includeEmptyDirs = false
}

dependencies {
	testImplementation group: 'junit', name: 'junit', version: '4.13.2'
	
	implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.26.1'
	implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.1'
	
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
	implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-xml', version: '3.2.4'
	implementation group: 'javax.activation', name: 'activation', version: '1.1.1'
	
	implementation name: "Centuria"
	implementation name: "connective-http"
}

project.configurations.implementation.canBeResolved = true

